name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish
        required: true
        default: v2.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Download and validate released packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]):
              raise SystemExit("Expected a stable vMAJOR.MINOR.PATCH release tag")
          PY
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Expected a published stable release") else . end'
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          python - <<'PY'
          import email, hashlib, os, pathlib, tarfile, zipfile
          version = os.environ["RELEASE_TAG"][1:]
          dist = pathlib.Path("dist")
          expected = {f"garmcli-{version}-py3-none-any.whl", f"garmcli-{version}.tar.gz"}
          if {p.name for p in dist.iterdir()} != expected | {"SHA256SUMS"}:
              raise SystemExit("Unexpected release assets")
          checksums = {}
          for line in (dist / "SHA256SUMS").read_text().splitlines():
              digest, name = line.split("  ", 1)
              if name in checksums:
                  raise SystemExit("Duplicate checksum entry")
              checksums[name] = digest
          for name in expected:
              if hashlib.sha256((dist / name).read_bytes()).hexdigest() != checksums.get(name):
                  raise SystemExit(f"Checksum mismatch: {name}")
          with zipfile.ZipFile(dist / f"garmcli-{version}-py3-none-any.whl") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Corrupt wheel")
              metadata = email.message_from_bytes(archive.read(f"garmcli-{version}.dist-info/METADATA"))
              if metadata["Name"] != "garmcli" or metadata["Version"] != version:
                  raise SystemExit("Wheel name/version differs from release tag")
          with tarfile.open(dist / f"garmcli-{version}.tar.gz") as archive:
              metadata = email.message_from_bytes(archive.extractfile(f"garmcli-{version}/PKG-INFO").read())
              if metadata["Name"] != "garmcli" or metadata["Version"] != version:
                  raise SystemExit("Source name/version differs from release tag")
          (dist / "SHA256SUMS").unlink()
          PY
      - name: Check package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
