[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "garmcli"
version = "2.0.0"
description = "Read-only Garmin Connect CLI for resumable sync, SQLite history and JSON exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["garminconnect==0.3.18", "keyring>=25.6,<26"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Matheus Coêlho"}]
keywords = ["garmin", "garmin-connect", "cli", "health-data", "sleep", "hrv", "sqlite", "json", "ai-agents", "offline"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/matheuscoelhomalta/garmcli"
Repository = "https://github.com/matheuscoelhomalta/garmcli"
Documentation = "https://github.com/matheuscoelhomalta/garmcli/blob/main/docs/reference.md"
Issues = "https://github.com/matheuscoelhomalta/garmcli/issues"
Changelog = "https://github.com/matheuscoelhomalta/garmcli/releases"

[project.scripts]
garmcli = "garmcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
